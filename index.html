<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Chubby Tuck Shop Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --chubby-blue: #009dff;
            --chubby-yellow: #ffde00;
            --chubby-red: #e62325;
            --chubby-green: #29b44a;
            --chubby-white: #ffffff;
        }

        body {
            font-family: 'Varela Round', sans-serif;
            background-color: var(--chubby-blue);
            background-image: radial-gradient(circle, #5ec3ff 0%, #009dff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .form-container {
            background-color: var(--chubby-white);
            width: 100%;
            max-width: 500px;
            border-radius: 40px;
            box-shadow: 0 15px 0px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 8px solid var(--chubby-yellow);
        }

        .header {
            background-color: var(--chubby-red);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-area {
            text-align: center;
            padding: 20px;
            background-color: var(--chubby-blue);
        }

        .logo-text {
            font-size: 50px;
            color: white;
            text-shadow: 4px 4px 0px #0056b3, -2px -2px 0px #0056b3, 2px -2px 0px #0056b3, -2px 2px 0px #0056b3;
            margin: 0;
            font-weight: 900;
        }

        form {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--chubby-blue);
            font-weight: bold;
            font-size: 1.1em;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            font-family: 'Varela Round', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--chubby-blue);
        }

        .footer-action {
            background-color: var(--chubby-green);
            padding: 20px;
            text-align: center;
        }

        button {
            background-color: var(--chubby-yellow);
            color: #333;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #c4ab00;
            transition: transform 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #c4ab00;
        }

        .contact-info {
            font-size: 0.8em;
            text-align: center;
            padding: 10px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">Join The Club!</div>

    <div class="logo-area">
        <h1 class="logo-text">CHUBBY</h1>
    </div>

    <form action="https://formsubmit.co/vikeshnun@gmail.com" method="POST">

        <div class="input-group">
            <label>Name of School</label>
            <input type="text" name="school_name" placeholder="School name..." required>
        </div>

        <div class="input-group">
            <label>Name & Title of Representative</label>
            <input type="text" name="representative" placeholder="e.g. John Doe (Principal)" required>
        </div>

        <div class="input-group">
            <label>Address</label>
            <input type="text" name="address" placeholder="Full school address" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Landline number">
        </div>

        <div class="input-group">
            <label>WhatsApp Number</label>
            <input type="tel" name="whatsapp" placeholder="+27..." required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="school@email.com" required>
        </div>

        <div class="input-group">
            <label>Website</label>
            <input type="url" name="website" placeholder="www.yourschool.com">
        </div>

        <div class="input-group">
            <label>Number of Learners</label>
            <input type="number" name="learner_count" placeholder="Total students">
        </div>

        <div class="input-group">
            <label>Age Range</label>
            <input type="text" name="age_range" placeholder="e.g. 5 - 13 years">
        </div>

        <div class="input-group">
            <label>Learners with access to Tuck Shop</label>
            <input type="number" name="tuckshop_access" placeholder="Estimated number">
        </div>

        <!-- FormSubmit configuration -->
        <input type="hidden" name="_captcha" value="false">

        <div class="footer-action">
            <button type="submit">Submit Details</button>
            <p style="color: white; margin-top: 10px; font-size: 0.9em;">Email or WhatsApp Us to Join</p>
        </div>
    </form>

    <div class="contact-info">
        www.brubecktrading.com | info@brubecktrading.com
    </div>
</div>

</body>
</html>
