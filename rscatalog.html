<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Retailers - Online Store</title>
    <style>
        :root { --blue: #0047AB; --yellow: #FFEA00; --white: #fff; --green: #25D366; }
        body { font-family: sans-serif; margin: 0; padding-bottom: 200px; background: #f4f4f4; }
        header { background: var(--blue); color: white; padding: 20px; text-align: center; }
        .details-form { background: white; padding: 20px; max-width: 500px; margin: 15px auto; border-radius: 10px; }
        .details-form input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 10px; flex-grow: 1; }
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #eee; }
        .footer { position: fixed; bottom: 0; width: 100%; background: white; padding: 20px; border-top: 4px solid var(--yellow); text-align: center; box-shadow: 0 -5px 10px rgba(0,0,0,0.1); }
        .order-btn { background: var(--green); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 80%; }
    </style>
</head>
<body>

<header>
    <h1>RS RETAILERS</h1>
    <p>6 Hopewell Rd, Malvern</p>
</header>

<div class="details-form">
    <h3>Customer Details</h3>
    <input type="text" id="custName" placeholder="Your Name">
    <input type="text" id="custArea" placeholder="Delivery Area / Collection">
</div>

<div class="container" id="grid"></div>

<div class="footer">
    <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;">Total: R<span id="totalDisplay">0</span></div>
    <button class="order-btn" onclick="sendOrder()">Send Order to Rikash</button>
</div>

<script>
    // Complete inventory from your flyer
    const products = [
        { id: 1, name: "Petal Soft 18s 2Ply", price: 70, img: "petal.jpg" },
        { id: 2, name: "Oh So Soft 18s 2Ply", price: 80, img: "ohsoft.jpg" },
        { id: 3, name: "Baby Soft 18s 2Ply", price: 130, img: "baby.jpg" },
        { id: 4, name: "Hand Wash 5L", price: 70, img: "handwash.jpg" },
        { id: 5, name: "Dishwashing Liquid 5L", price: 55, img: "dishwash.jpg" },
        { id: 6, name: "Thick Bleach 5L", price: 65, img: "bleach.jpg" },
        { id: 7, name: "Black Dip 5L", price: 70, img: "blackdip.jpg" },
        { id: 8, name: "5Kg Washing Powder", price: 100, img: "powder.jpg" }
    ];

    let basket = {};

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = products.map(p => {
            const qty = basket[p.id] ? basket[p.id].qty : 0;
            return `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://placehold.co/400x300?text=No+Photo'">
                    <div class="card-body">
                        <div style="font-weight:bold">${p.name}</div>
                        <div style="color:blue">R${p.price}</div>
                    </div>
                    <div class="controls">
                        <button onclick="updateBasket(${p.id}, -1)">-</button>
                        <span>${qty}</span>
                        <button onclick="updateBasket(${p.id}, 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateBasket(id, change) {
        const p = products.find(x => x.id === id);
        if (!basket[id]) {
            if (change > 0) basket[id] = { name: p.name, price: p.price, qty: 1 };
        } else {
            basket[id].qty += change;
            if (basket[id].qty <= 0) delete basket[id];
        }
        updateUI();
    }

    function updateUI() {
        let total = 0;
        for (let id in basket) { total += (basket[id].price * basket[id].qty); }
        document.getElementById('totalDisplay').innerText = total;
        render();
    }

    function sendOrder() {
        const name = document.getElementById('custName').value;
        if (!name) return alert("Enter your name first!");
        let msg = `*ORDER FROM RS RETAILERS*%0a*Name:* ${name}%0a*Area:* ${document.getElementById('custArea').value}%0a%0a`;
        for (let id in basket) { msg += `- ${basket[id].qty}x ${basket[id].name}%0a`; }
        msg += `%0a*Total: R${document.getElementById('totalDisplay').innerText}*`;
        window.open(`https://wa.me/27810438562?text=${msg}`);
    }
    render();
</script>
</body>
</html>
