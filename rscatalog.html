        let total = 0;
        let basket = {};
        function render() {
            if (products.length === 0) {
                document.getElementById('shop-grid').innerHTML = "<p>Store items loading...</p>";
                return;
            }
            document.getElementById('shop-grid').innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}">
                    <div style="font-weight:bold; margin: 10px 0;">${p.name}</div>
                    <div style="color:#0047AB; font-weight:bold;">R${p.price}</div>
                    <button onclick="add(${p.price},'${p.name}')" style="background:#FFEA00; border:none; border-radius:5px; width:100%; padding:8px; margin-top:5px; cursor:pointer;">Add</button>
                </div>
            `).join('');
        }
        function add(price, name) {
            total += parseFloat(price);
            document.getElementById('total').innerText = "Total: R" + total;
            basket[name] = (basket[name] || 0) + 1;
        }
        function sendOrder() {
            if (total === 0) return alert("Basket is empty!");
            let msg = "*ORDER FOR RS RETAILERS*%0a%0a";
            for (let item in basket) { msg += `- ${basket[item]} x ${item}%0a`; }
            msg += `%0a*TOTAL: R${total}*`;
            window.open("https://wa.me/27810438562?text=" + msg);
        }
        render();
    </script>
